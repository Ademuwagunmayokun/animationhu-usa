services:
  - type: web
    name: animationhub
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: animationhub-db
          property: connectionString

databases:
  - name: animationhub-db
    databaseName: animationhub
    plan: free
